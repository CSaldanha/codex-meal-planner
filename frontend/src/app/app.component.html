<header class="relative overflow-hidden bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 text-white shadow-2xl">
  <div class="absolute inset-0">
    <div class="absolute -left-24 top-1/2 h-64 w-64 -translate-y-1/2 rounded-full bg-primary-500/40 blur-3xl"></div>
    <div class="absolute right-0 top-12 h-72 w-72 rounded-full bg-accent/30 blur-[120px]"></div>
  </div>
  <div class="relative mx-auto flex max-w-7xl flex-col items-center gap-4 px-4 py-16 text-center sm:px-6 lg:px-8">
    <span class="rounded-full border border-white/10 bg-white/5 px-4 py-1 text-xs font-semibold uppercase tracking-[0.4em] text-white/70">
      Smart Meal Planner
    </span>
    <h1 class="text-4xl font-semibold tracking-tight sm:text-5xl">
      {{ title }}
    </h1>
    <p class="max-w-2xl text-base text-white/85 sm:text-lg">
      Plan smarter meals, save time at the store, and uncover substitutions that stretch each dollar.
    </p>
  </div>
</header>

<main class="relative z-10 -mt-16 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <app-meal-planner></app-meal-planner>
  </div>
</main>

<footer class="px-4 py-12 text-center text-sm text-slate-500 sm:px-6">
  <small class="inline-flex flex-wrap items-center justify-center gap-2">
    Built with Angular & NestJS. Seed the API with
    <code class="rounded bg-slate-900 px-2 py-1 text-xs font-semibold text-white">npm run seed</code>
    in the backend workspace to get started quickly.
  </small>
</footer>
